# /etc/systemd/system.conf.d/camera-hardware-watchdog.conf — apply with: sudo systemctl daemon-reexec
# systemd pets the Pi's hardware watchdog; a hung system, or a reboot stuck for more than 2 minutes
# (e.g. on a process blocked by a hung VideoCore firmware), is reset by the hardware instead of needing
# a power cycle. The BCM2835 watchdog cannot count longer than ~15 s, hence RuntimeWatchdogSec=15.
[Manager]
RuntimeWatchdogSec=15
RebootWatchdogSec=2min
